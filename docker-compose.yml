version: '3.8'

services:
  # Load Balancer / Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always

  # Backend API - Scaled dynamically based on load
  backend:
    build: 
      context: ./backend
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/cdac-examweb
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secure_enterprise_secret_key
    deploy:
      replicas: 3 # High Availability setup
      restart_policy:
        condition: on-failure
    depends_on:
      - mongo
      - redis

  # Frontend Web Server
  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_BASE_URL=https://api.yourdomain.com
    restart: always

  # Primary Database (MongoDB Replica Set for DR)
  mongo:
    image: mongo:6-jammy
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    restart: always

  # In-Memory Cache & Session Store for active exams and rate limiting
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  mongo_data:
  redis_data:
